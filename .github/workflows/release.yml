name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  aur:
    name: Publish to AUR
    runs-on: ubuntu-latest
    needs: goreleaser
    if: "!contains(github.ref_name, '-')"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download checksums
        run: gh release download "$GITHUB_REF_NAME" -p checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update PKGBUILD
        run: |
          SHA_X86=$(grep "dman_Linux_x86_64.tar.gz" checksums.txt | awk '{print $1}')
          SHA_ARM64=$(grep "dman_Linux_arm64.tar.gz" checksums.txt | awk '{print $1}')
          VERSION=${GITHUB_REF_NAME#v}
          cp packaging/aur/PKGBUILD ./PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${SHA_X86}')/" PKGBUILD
          sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${SHA_ARM64}')/" PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: dman
          pkgbuild: ./PKGBUILD
          commit_username: Alex Joedt
          commit_email: 84435160+alexjoedt@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
