version: '3'

vars:
  BINARY: dman


tasks:
  tidy:
    cmds:
      - go fmt ./...
      - go mod tidy

  test:
    cmds:
      - go test --cover ./...
      - go mod verify

  build:
    vars:
      VERSION:
        sh: git describe --tags --match "v*" --abbrev=0 2>/dev/null || echo "dev"
    cmds:
      - go mod verify
      - go build -ldflags "-s -w -X main.Version={{.VERSION}}" -o bin/{{.BINARY}} .
      - chmod +x bin/{{.BINARY}}

  run:
    cmds:
      - task: build
      - ./bin/{{.BINARY}}

  clean:
    cmds:
      - rm -rf bin

  install:
    cmds:
      - task: build
      - cp ./bin/{{.BINARY}} $HOME/.local/bin/{{.BINARY}}
