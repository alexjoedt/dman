version: '3'

vars:
  BINARY: dman


tasks:
  tidy:
    cmds:
      - go fmt ./...
      - go mod tidy

  test:
    cmds:
      - go test --cover ./...
      - go mod verify

  build:
    cmds:
      - go mod verify
      - go build -o bin/{{.BINARY}} cmd/main.go
      - chmod +x bin/{{.BINARY}}

  run:
    cmds:
      - task: build
      - ./bin/{{.BINARY}}

  clean:
    cmds:
      - rm -rf bin

  install:
    cmds:
      - task: build
      - cp ./bin/{{.BINARY}} $HOME/.grip/bin/{{.BINARY}}
